[package]
name = "castavox-core"
version = "0.1.0"
authors = ["Ayorinde G. Smart"]
description = "The parts Castavox and Pulpitry both need: transcripts, exports, audio capture, local speech, and the embedding model."
edition = "2021"
publish = false

# Permissive on purpose, and it has to be.
#
# Castavox is GPL-2.0-or-later, being a fork of OBS. Pulpitry is proprietary.
# The same code cannot be GPL in one and closed in the other: a GPL crate would
# make Pulpitry GPL the moment it linked. MIT satisfies both -- the GPL can
# absorb it, and a closed product can use it -- which is what makes one shared
# copy legal rather than merely convenient.
license = "MIT"

[dependencies]
anyhow = "1"

# A machine identifier for a hosted subscription. Already in the tree behind
# rustls; taken directly so hosted.rs is not relying on somebody else's
# dependency staying where it is.
getrandom = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# bundled: compiles SQLite in, so there is no dependency on whatever version the
# host ships. FTS5 is enabled in that build.
#
# The version has to match in every crate that reaches the database.
# libsqlite3-sys declares `links = "sqlite3"`, so Cargo permits exactly one in
# the tree -- two would not be a duplicate but a hard build failure, which is
# how the two products having drifted apart on this was finally noticed.
rusqlite = { version = "0.40", features = ["bundled"] }

# Summaries leave as something a church can send on.
zip = { version = "2", default-features = false, features = ["deflate"] }
printpdf = { version = "0.7", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd", "html"] }

# Microphone capture. The Azure SDK's own mic input is written against browser
# APIs that do not exist under Node, so capture happens here.
cpal = "0.18"

# Paraphrase matching, and the model behind it.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
rayon = "1"

# Finding the other application on the church's wifi.
#
# No async runtime: this is the only crate in the tree that would have pulled
# one in, and a tokio reactor spun up to answer multicast questions would be a
# large thing to carry for a small one. mdns-sd runs its own thread and talks
# over channels, which is the shape everything else here already uses.
#
# Licensing checked, because this crate is linked into a GPL-2.0-or-later
# product and a proprietary one. It and its four dependencies all offer MIT --
# mdns-sd and flume as "Apache-2.0 OR MIT", if-addrs as "MIT OR BSD-3-Clause",
# socket-pktinfo as MIT -- so the MIT arm is taken throughout and neither
# product has anything to reconcile. Apache-2.0 alone would have been a problem
# for the GPLv2 arm of Castavox's licence.
mdns-sd = { version = "0.21", default-features = false }

# Proving a pairing without putting the secret on the wire.
#
# RustCrypto rather than ring, which is already here behind rustls and would
# have cost nothing to reach for. ring is "Apache-2.0 AND ISC" with no MIT arm;
# these are "MIT OR Apache-2.0", so the MIT arm is available and the crypto this
# crate introduces sits on the same footing as everything else it links into a
# GPL product and a proprietary one.
hmac = "0.12"
sha2 = "0.10"

# Local transcription, and fetching the models it runs on.
# Local transcription, CPU everywhere. The GPU backends that accelerate it are
# per-platform and live at the bottom of this file, where a table header cannot
# swallow the dependencies that follow it.
whisper-rs = { version = "0.16", default-features = false }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# `rustls-no-provider`, not `rustls`, and the difference is not cosmetic.
#
# Plain `rustls` brings in rustls-platform-verifier, which turns on aws-lc-rs —
# and Cargo unifies features across the whole tree, so this one word reached
# into Pulpitry and undid the same choice made deliberately there. Two providers
# were then compiled in while `tls::install` installed ring, and every HTTPS
# request from that process failed with "error sending request for url" and no
# cause: summaries and slides both, on a machine where curl worked.
#
# One provider, named here and installed by `tls::install`. It also keeps a C
# toolchain off every machine that builds this, which was the original reason.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "blocking"] }

[profile.release]
# Size, except where speed is the product.
#
# Small binaries matter here: two desktop applications, downloaded over
# connections that are often poor, updated regularly. But `whisper-rs` and the
# ggml it builds are the one thing in this crate whose *speed* is what a church
# experiences, and optimising those for size is optimising the wrong thing --
# a transcript that arrives after the sentence is not a smaller download, it is
# a broken feature.
opt-level = "s"

[profile.release.package.whisper-rs]
opt-level = 3

[profile.release.package.whisper-rs-sys]
opt-level = 3

# Metal on macOS, which is the difference between "needs a fast Mac" and "runs
# on the Mac a church already has". Measured on an M-series machine with
# base.en: 0.26s to decode six seconds of audio on the CPU, 0.13s with Metal.
#
# Free to enable: Metal ships with the OS, needs no SDK at build time and no
# driver at run time, and whisper.cpp falls back to the CPU on a machine that
# cannot use it. There is no version of this that makes anything worse.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

# Vulkan on Windows, and Vulkan rather than CUDA on purpose.
#
# CUDA is faster where it applies and applies to NVIDIA only, which is not the
# machine this is for. The church laptop that cannot keep up has Intel or AMD
# integrated graphics, and Vulkan is the one backend that reaches all three --
# so it helps the hardware that needs helping rather than the hardware that was
# already fine.
#
# whisper.cpp falls back to the CPU when no Vulkan device is present, so the
# worst case is what we ship today.
#
# The cost is a build-time dependency: the Vulkan SDK has to be on the machine
# that *compiles* this, which means the Windows runner needs a step to install
# it, and getting that wrong fails at link time rather than at run time.
#
# x86_64 only, and the reason is that build-time cost rather than anything about
# the hardware. The SDK installer the runners use publishes no arm64 Windows
# package, so an arm64 build with this feature on fails to link -- it does not
# quietly fall back, because the fallback is a run-time one and this fails
# before that. Windows on ARM therefore stays on the CPU, which is what shipped
# before any of this, and it is a smaller loss than no arm64 build at all.
# Not enabled here any more; see the `vulkan` feature below.
[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false }

# Vulkan on Windows, which a product opts into rather than receives.
#
# Building with it puts a *load-time* import of vulkan-1.dll into whatever links
# this. On a machine with no Vulkan runtime -- an old laptop, a driver older
# than the extension -- Windows refuses to start that process at all, and the
# only sign is a dialogue naming a DLL nobody has heard of.
#
# The loader can be shipped alongside, and Castavox does exactly that: its
# speech engine is a separate executable and the loader installs into the same
# directory, which is where Windows looks.
#
# Pulpitry cannot. Its bundled files land under `resources/`, which the loader
# never searches, so the same trick puts the DLL somewhere Windows will not find
# and the application still refuses to open. Until that is solved properly --
# delay-loading, or placing the file beside the executable -- Pulpitry on
# Windows transcribes on the processor, which is what those machines were going
# to do anyway.
[features]
default = []
vulkan = ["whisper-rs/vulkan"]
